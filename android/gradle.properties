# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Enable R8 in release builds
android.enableMinifyInReleaseBuilds=true

# Restringe a compilação local apenas à arquitetura do emulador para economizar tempo e espaço
reactNativeArchitectures=x86_64

# Architecture features
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Expo Media settings
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging
expo.useLegacyPackaging=false

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
android.builtInKotlin=false
android.newDsl=false

expo.inlineModules.watchedDirectories=[]
android.packagingOptions.pickFirsts=**/libhermes.so,**/libc++_shared.so,**/libworklets.so,**/libreanimated.so

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Reduz o caminho dos artefatos nativos C++/CMake no Windows para evitar o limite de 260 caracteres
android.cxx.build.dir=C:/tmp/cxx