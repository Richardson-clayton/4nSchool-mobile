# Specifica os argumentos da JVM para o daemon do Gradle (2GB é suficiente e não trava a RAM)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# DESATIVA compilação paralela excessiva para liberar a CPU do Windows
org.gradle.parallel=false
org.gradle.workers.max=2

# Limita o consumo do daemon do Kotlin
kotlin.daemon.jvmargs=-Xmx1024m

# AndroidX package structure
android.useAndroidX=true

# Restringe a compilação local apenas à arquitetura do emulador x86_64
reactNativeArchitectures=x86_64

# Architecture features
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Expo Media settings
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging
expo.useLegacyPackaging=false

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
android.builtInKotlin=false
android.newDsl=false

expo.inlineModules.watchedDirectories=[]
android.packagingOptions.pickFirsts=**/libhermes.so,**/libc++_shared.so,**/libworklets.so,**/libreanimated.so

# Reduz o caminho dos artefatos nativos C++/CMake no Windows para evitar MAX_PATH
android.cxx.build.dir=C:/tmp/cxx